{% extends 'base.html' %}{% block content %}<div class="container py-5"><a href="{% url 'dashboard' %}">← Staff dashboard</a><h1 class="mt-3">Companies</h1><form class="d-flex gap-2 my-3"><input class="form-control" name="q" value="{{ q }}" placeholder="Search company, owner, industry, or location"><button class="btn btn-primary">Search</button></form><div class="card table-responsive mt-4"><table class="table align-middle mb-0"><thead><tr><th>Company</th><th>Owner</th><th>Status</th><th>Actions</th></tr></thead><tbody>{% for c in companies %}<tr><td><b>{{ c.name }}</b><div class="small text-muted">{{ c.industry }} · {{ c.location }}</div></td><td>{{ c.owner }}<div class="small text-muted">{{ c.owner.email }}</div></td><td>{{ c.get_status_display }}</td><td><a class="btn btn-sm btn-outline-secondary" href="{% url 'company_edit' c.pk %}">Edit</a> <a class="btn btn-sm btn-success" href="{% url 'moderate_company' c.pk 'approve' %}">Approve</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'moderate_company' c.pk 'reject' %}">Reject</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
