{% extends 'base.html' %}{% block content %}<div class="container py-5"><h1>Saved jobs</h1><div class="row g-3 mt-2">{% for item in saved %}<div class="col-md-6"><div class="card job-card"><div class="card-body"><h5><a href="{{ item.job.get_absolute_url }}">{{ item.job.title }}</a></h5><div>{{ item.job.company.name }}</div><div class="small text-muted mt-2">{{ item.job.location }} · {{ item.job.salary_display }}</div></div></div></div>{% empty %}<p class="text-muted">You have not saved any jobs.</p>{% endfor %}</div></div>{% endblock %}
