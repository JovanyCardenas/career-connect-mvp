{% extends 'base.html' %}{% block content %}<div class="container py-5"><h1>My applications</h1><div class="card mt-4"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Position</th><th>Submitted</th><th>Status</th></tr></thead><tbody>{% for app in applications %}<tr><td><a href="{{ app.job.get_absolute_url }}"><b>{{ app.job.title }}</b></a><div class="small text-muted">{{ app.job.company.name }}</div></td><td>{{ app.created_at|date:'M j, Y' }}</td><td><span class="badge text-bg-light">{{ app.get_status_display }}</span></td></tr>{% empty %}<tr><td colspan="3" class="p-4 text-muted">No applications yet.</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
