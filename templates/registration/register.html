{% extends 'base.html' %}{% block content %}<div class="container py-5" style="max-width:760px"><h1>Create your CareerConnect account</h1><p class="text-muted">Choose the account type that best describes you. Current students receive access to eligible on-campus jobs.</p><form method="post" class="card p-4">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Create account</button></form></div><script>
const type=document.getElementById('id_account_type'); function updateFields(){const v=type.value; ['id_school_email','id_student_id','id_school_name','id_graduation_year'].forEach(id=>{const el=document.getElementById(id); if(el) el.closest('p').style.display=(v==='student'||v==='alumni')?'block':'none';}); document.getElementById('id_student_id').required=v==='student'; document.getElementById('id_school_email').required=v==='student'; document.getElementById('id_school_name').required=v==='student'; document.getElementById('id_graduation_year').required=v==='alumni';} type.addEventListener('change',updateFields); updateFields();</script>{% endblock %}
